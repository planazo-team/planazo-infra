# Infraestructura local de Planazo.
#
#   docker compose up -d                           → solo infra (Redis + 4 Postgres) + la red compartida; game corre con `mvn spring-boot:run`
#   docker compose --profile app up --build -d     → infra + game (el único servicio que este compose construye)
#   docker compose --profile app --profile frontend up --build  → además el frontend
#
# Escenario 4 (Disponibilidad): api-gateway, booking, promo y realtime YA NO
# se construyen aquí — cada uno tiene su propio `docker-compose.yml` en su
# propio repo (2 réplicas + su balanceador Nginx, autosuficiente). Este
# compose solo crea la red compartida (`planazo-net`, ver abajo) a la que
# esos 4 repos se conectan, y las bases de datos/Redis que usan. `game`
# sigue aquí sin replicar (su estado vive en memoria por sala, ver
# `planazo-game/ARQUITECTURA.md`). Detalle completo en
# `ESCENARIO-04-DISPONIBILIDAD.md`.
#
# Los secretos compartidos (JWT_SECRET, GATEWAY_KEY, ...) vienen de `.env`
# (copia de `.env.example`); los 4 repos que ya no están aquí también la
# leen, con `env_file: ../planazo-infra/.env`.

networks:
  default:
    # Nombre fijo (en vez del `planazo-infra_default` que Compose pondría
    # solo): así api-gateway/booking/promo/realtime, cada uno con su propio
    # `docker-compose.yml`, se conectan a esta misma red con
    # `external: true` sin tener que adivinar el nombre.
    name: planazo-net

x-app-common: &app-common
  restart: unless-stopped
  env_file: .env
  profiles: ["app"]

services:
  # ------------------------------------------------------------------
  # Infra siempre activa
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: planazo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-booking:
    image: postgres:16-alpine
    container_name: planazo-postgres-booking
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5433:5432"
    volumes:
      - pg-booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-promo:
    image: postgres:16-alpine
    container_name: planazo-postgres-promo
    environment:
      POSTGRES_DB: promo
      POSTGRES_USER: promo
      POSTGRES_PASSWORD: promo
    ports:
      - "5434:5432"
    volumes:
      - pg-promo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo -d promo"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-realtime:
    image: postgres:16-alpine
    container_name: planazo-postgres-realtime
    environment:
      POSTGRES_DB: realtime
      POSTGRES_USER: realtime
      POSTGRES_PASSWORD: realtime
    ports:
      - "5435:5432"
    volumes:
      - pg-realtime-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtime -d realtime"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-game:
    image: postgres:16-alpine
    container_name: planazo-postgres-game
    environment:
      POSTGRES_DB: minijuego
      POSTGRES_USER: minijuego
      POSTGRES_PASSWORD: minijuego
    ports:
      - "5436:5432"
    volumes:
      - pg-game-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minijuego -d minijuego"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # Servicios de aplicación (profile "app")
  # ------------------------------------------------------------------
  # api-gateway, booking, promo y realtime viven ahora en su propio repo
  # (ver cabecera de este archivo): se levantan con `docker compose up` en
  # ../planazo-<servicio>, no aquí. `scripts/up-all.sh`/`down.sh` ya hacen
  # ese loop por ti.
  game:
    <<: *app-common
    build:
      context: ../planazo-game   # Java 21 + Spring Boot; Dockerfile multi-stage con Maven
    container_name: planazo-game
    ports:
      - "8082:8082"   # REST /api/v1, Swagger y STOMP /ws en el mismo puerto
    environment:
      SERVER_PORT: "8082"
      PGHOST: postgres-game
      PGPORT: "5432"
      PGDATABASE: minijuego
      PGUSER: minijuego
      PGPASSWORD: minijuego
      REDISHOST: redis
      REDISPORT: "6379"
      JWT_SECRETO: ${JWT_SECRET}   # el mismo secreto del gateway, con el nombre que lee game
    depends_on:
      postgres-game:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # ------------------------------------------------------------------
  # Frontend (profile "frontend", opcional)
  # ------------------------------------------------------------------
  # Construye ../planazo-frontend/frontend/Dockerfile.
  # Las NEXT_PUBLIC_* se resuelven en tiempo de build de Next.js, por eso van también como build args.
  # Apuntan a localhost porque quien las usa es el navegador, no el contenedor.
  frontend:
    profiles: ["frontend"]
    restart: unless-stopped
    build:
      context: ../planazo-frontend/frontend
      args:
        NEXT_PUBLIC_API_MODE: live
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_REALTIME_URL: ws://localhost:8081/ws
        NEXT_PUBLIC_GAME_URL: ws://localhost:8082
    container_name: planazo-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_MODE: live
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:8081/ws
      NEXT_PUBLIC_GAME_URL: ws://localhost:8082

volumes:
  redis-data:
  pg-booking-data:
  pg-promo-data:
  pg-realtime-data:
  pg-game-data:
