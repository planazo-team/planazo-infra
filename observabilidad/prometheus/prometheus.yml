# Prometheus de Planazo (Feature 10.4, Observabilidad). Corre como un servicio
# más en Railway y recoge las métricas de CADA instancia por la red privada
# (*.railway.internal, puerto 9464, que no tiene dominio público).
global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ['planazo-api-gateway.railway.internal:9464', 'planazo-api-gateway-b.railway.internal:9464']

  - job_name: booking
    static_configs:
      - targets: ['planazo-booking.railway.internal:9464', 'planazo-booking-b.railway.internal:9464']

  - job_name: promo
    static_configs:
      - targets: ['planazo-promo.railway.internal:9464', 'planazo-promo-b.railway.internal:9464']

  - job_name: realtime
    static_configs:
      - targets: ['planazo-realtime.railway.internal:9464', 'planazo-realtime-b.railway.internal:9464']

  - job_name: game
    static_configs:
      - targets: ['planazo-game.railway.internal:9464']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
