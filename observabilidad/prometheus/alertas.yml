# Alertas de Planazo (HU-135). Grafana las muestra en el tablero técnico.
groups:
  - name: planazo
    rules:
      - alert: ErroresAltos
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1e-9) > 0.05
        for: 2m
        labels:
          severidad: critica
        annotations:
          resumen: Más del 5 % de las peticiones terminan en error 5xx.

      - alert: InstanciaCaida
        expr: up{job!="prometheus"} == 0
        for: 30s
        labels:
          severidad: critica
        annotations:
          resumen: 'La instancia {{ $labels.instance }} de {{ $labels.job }} no responde.'

      - alert: LatenciaTiempoRealAlta
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(planazo_evento_latencia_seconds_bucket[5m]))) > 0.3
        for: 2m
        labels:
          severidad: alta
        annotations:
          resumen: El p95 de la latencia publicación → entrega en tiempo real supera 300 ms.

      - alert: AtaqueDetectado
        expr: increase(planazo_ataques_detectados_total[5m]) > 0
        labels:
          severidad: alta
        annotations:
          resumen: El gateway bloqueó al menos una IP por ráfagas de 401/429.
