name: ci

on:
  push:
    branches: [main, diego]
  pull_request:

jobs:
  ci:
    name: Validar compose, scripts, k6 y contratos
    runs-on: ubuntu-latest
    # El contexto `secrets` no se puede usar dentro de un `if:` (restricción
    # de GitHub Actions, no un typo); por eso se refleja primero en env a
    # nivel de job y el `if:` del paso de Sonar compara `env.SONAR_TOKEN`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # docker compose necesita el .env que referencian los servicios del profile "app"
      - name: Preparar .env de prueba
        run: cp .env.example .env

      - name: Validar docker-compose.yml (infra y profile app)
        run: |
          docker compose config -q
          docker compose --profile app config -q

      - name: Sintaxis de los scripts bash
        run: |
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Sintaxis de los scripts k6
        run: |
          for f in k6/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Validar contracts/events.schema.json
        run: npx --yes ajv-cli@5 compile -s contracts/events.schema.json

      # Escenario 5 (Mantenibilidad): análisis estático con SonarCloud en
      # los 7 repositorios. Aquí no hay cobertura que reportar (no es un
      # servicio de aplicación), pero sí scripts y k6 sobre los que Sonar
      # puede señalar code smells/duplicación. No falla el build si el
      # secret no está configurado: falta crear el proyecto en
      # SonarCloud y guardar SONAR_TOKEN (y opcionalmente
      # SONAR_ORGANIZATION / SONAR_PROJECT_KEY) como secret del repo.
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'planazo-infra' }}
